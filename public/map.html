        /* loading animation*/

            }
            20%, 29% {
            transform: rotate(0deg);
            }
            30%, 39% {
            transform: rotate(-45deg);
            }
            40%, 49% {
            transform: rotate(0deg);

        /* Styles for the triangle shape */
        .triangle {
            width: 0;
            height: 0;
            border-left: 5px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 10px solid;

            transform-origin: center center;

            /* ✅ Rotation + scale driven by CSS variables */
            transform: rotate(var(--rotation, 0deg)) scale(var(--scale, 1));

            opacity: 1;
        }

        .loader {
            width: 100px;
            height: 40px;
            --g: radial-gradient(farthest-side,#0000 calc(95% - 3px),#fff calc(100% - 3px) 98%,#0000 101%) no-repeat;
            background: var(--g), var(--g), var(--g);
            background-size: 30px 30px;
            animation: l9 1s infinite alternate;
            }
            @keyframes l9 {
            0% {
                background-position: 0 50%, 50% 50%, 100% 50%;
            }
            20% {
                background-position: 0 0, 50% 50%, 100% 50%;
            }
            40% {
                background-position: 0 100%, 50% 0, 100% 50%;
            }
            60% {
                background-position: 0 50%, 50% 100%, 100% 0;
            }
            80% {
                background-position: 0 50%, 50% 50%, 100% 100%;
            }
            100% {
                background-position: 0 50%, 50% 50%, 100% 50%;
            }
            }

        @keyframes ripple {
        0% {
            transform: scale(0);
            opacity: 1;
        }
        50% {
            transform: scale(4); /* Make the ripple grow larger */
            opacity: 0.3; /* Fade the ripple as it grows */
        }
        100% {
            transform: scale(6); /* Make it even larger for the full effect */
            opacity: 0; /* Fully fade out at the end */
        }
        }

        .pulse-animation {
        animation: ripple 1.5s ease-out infinite; /* Infinite animation */
        position: absolute;
        border-radius: 50%;
        background: rgba(0, 0, 255, 0.3); /* Light blue color for the ripple */
        pointer-events: none; /* Prevent interaction with the ripple */
        z-index: 1000; /* Ensure it's on top of the marker */
        }

                const allData = await Promise.all(responses.map(res => {

                    return res.json();

        // main function to fetch data from API
        async function fetchData(URL) {
            setElementsDisplay([loadingContainer],'flex')
            try { const response = await fetch(URL, { 
                    headers: headers
                });
                if (!response.ok) {
                    if (response.status === 401) {
                        console.error('Unauthorized token');
                    } else if (response.status === 404) {
                        console.error('Data is not available');
                    } else if (response.status === 422) {
                        console.error('Data is not available');
                    } else {
                        throw new Error('Network response was not ok');
                    }
                }
                
                const data = await response.json();
                // assuming data.Decoded is the array of AIS messages
                aisData = data.Decoded;

                if (!aisData || aisData.length === 0) {
                        console.error('AIS data is not available or empty.');
                        resultCount.innerHTML = "No matching result";
                        setElementsDisplay([loadingContainer],'none');
                        return;
                    } else{
                        // Update the content of the info box with the count of results

                        const filteredData = aisData.filter(data => ['1', '2', '3', '4', '21', '18', '19'].includes(data.type));
                        const dataCount = filteredData.length;
                        const resultText = dataCount === 1 ? 'result': 'results';
                        const countText = `Showing ${dataCount} ${resultText}`;
                        resultCount.style.display = 'none';
                        resultCount.innerHTML = countText;
                    }
                
                // Button to show different source of data 
                sourceButtons.forEach(sourceButton => {
                    sourceButton.addEventListener('click', function () {
                        sourceButtons.forEach(btn => btn.classList.remove('active'));
                        sourceButton.classList.add('active');
                        
                        zoomstatus = true;
                        removeMarkers(map); 
                        let sourceData =[]
                        if (sourceButton.id === 'all-data-button'){
                            filterData(aisData);
                        } else if (sourceButton.id === 'satellite-data-button'){
                            for (const sdata of aisData){
                                if (sdata.source === "1"){
                                    sourceData.push(sdata);
                                }
                            }
                            filterData(sourceData);
                        } else if (sourceButton.id === 'terrestrial-data-button'){
                            for (const sdata of aisData){
                                if (sdata.source === "0"){
                                    sourceData.push(sdata);
                                }
                            }
                            filterData(sourceData);
                        }
                    });
                });
                
                filterData(aisData);
                
                // Function to filter the data that need to be show in one frame
                function filterData(data){
                    // function to eliminate the crowded marker based on their coordinates (closer, show less)
                    function areCoordinatesClose(coord1, coord2, threshold) {
                        const lat1 = parseFloat(coord1.lat);
                        const lon1 = parseFloat(coord1.lon);
                        const lat2 = parseFloat(coord2.lat);
                        const lon2 = parseFloat(coord2.lon);
                    
                        if (!isNaN(lat1) && !isNaN(lon1) && !isNaN(lat2) && !isNaN(lon2)) {
                            const latDiff = Math.abs(lat1 - lat2);
                            const lonDiff = Math.abs(lon1 - lon2);
                            return latDiff <= threshold && lonDiff <= threshold;
                        }
                    
                        // If any of the coordinates are invalid, consider them not close.
                        return true;
                    }
                    
                    // function to randomize the set of data to show only a number of the data (limit data) to minimize the crowded map
                    function getRandomItemsFromArray(array, numberOfItems, threshold) {
                        // Filter out coordinates that are close to others
                        const filteredArray = [];
                        for (const item of array) {
                            if (filteredArray.every((filteredItem) => !areCoordinatesClose(item, filteredItem, threshold))) {
                                filteredArray.push(item);
                            }
                        }
                    
                        // Shuffle the filtered array
                        const shuffledArray = filteredArray.slice().sort(() => Math.random() - 0.5);
                    
                        // Return the first 'numberOfItems' items from the shuffled array
                        return shuffledArray.slice(0, numberOfItems);
                    }
                    
                    boundData(data);
                    
                    // function to check the data if it is within the frame map boundary
                    function boundData(data){
                        var zoomLevel = map.getZoom();
                        var mapBounds = map.getBounds();
                        let zoomData = [];
                
                        for (const zdata of data) {
                            // Convert lat and lon strings to numbers
                            const lat = parseFloat(zdata.lat);
                            const lon = parseFloat(zdata.lon);
                        
                            if (!isNaN(lat) && !isNaN(lon)) {
                                var targetLatLng = L.latLng(lat, lon);
                        
                                if (mapBounds.contains(targetLatLng)) {
                                    // If the condition is true, append zdata to zoomData
                                    zoomData.push(zdata);
                                }
                            } 
                        }
                        let range = null;
						let mapData = null;
                        removeMarkers(map);
                        // if the number of data within boundary is more than limit data, do the randomized and location check
                        if (zoomData.length>limitData){
                            if (zoomLevel<=3){
                                range = 1;  
                            } else if (zoomLevel>=3 && zoomLevel<=5){
                                range = 0.1;
                            } else if (zoomLevel>=6 && zoomLevel<=8){
                                range = 0.01;
                            } else if (zoomLevel>=9){
                                range = 0.001;
                            }
							mapData = getRandomItemsFromArray(zoomData, limitData, range)
                            currentMap = markVessel(getRandomItemsFromArray(zoomData, limitData, range));
                        }else {
							mapData = zoomData;
                            updateMapAfterFilter(mapData);
                        }
                        
                        setElementsDisplay([statText],'block')
                        statText.innerHTML= `Available Data: ${zoomData.length}`
                        // statText.innerHTML= `Zoom Level: ${zoomLevel} | Map Bound | Data Available: ${zoomData.length} | Data Shown: ${mapData.length}`
                        // statText.innerHTML= `Data Available: ${zoomData.length} | Data Shown: ${mapData.length}`
                    }
    
                    // Add an event listener to log the zoom level when it changes
                    map.on('zoomend moveend', function (event) {
                        zoomstatus = true;
                        boundData(data);
                        if (infostatus === true){
                            setElementsDisplay([infoBox],'block')
                        }
                    });
                }    
            } catch (error) {
                console.error('There was a problem with the fetch operation:', error);
            }
        }
        
        // main function to mark the vessel on the map
        function markVessel(data) {
            // check for the first data point
            const validMsgTypes = ['1','2','3','4','21','18','19'];
            firstDataPoint = null;
            aisData.forEach(item => {
                if (validMsgTypes.includes(item.type)) {
                    firstDataPoint = item;
                    return; // Exit the loop after finding the first valid data point
                } else {
                    firstDataPoint = {"lat": "0","lon": "0"};
                }
            });
            
            // check for zoomstatus, different option have different initial view
            if (zoomstatus === false){
                if (option === "Location"){
                    map.setView([latStr,lonStr],5);
                } else if (option === "All"){
                    map.setView([3.03,101.34],10);
                } else if (option === "MMSI"){
                    map.setView([firstDataPoint.lat, firstDataPoint.lon], 10);
                }
            }
            
            // set the icon to use custom design
            const customIcon = L.divIcon({
                className: 'custom-icon',
                iconAnchor: [4, 8],
                popupAnchor: [0, -8],
                html: '<div class="triangle"></div>'
            });
                
            const markers = []; // Create an array to store markers
            
            // loop to mark the vessel
            data.forEach(item => {

                // Skip static messages
                if (item.type === '5' || item.type === '24') return;

                // Validate position
                if ('0' in item || !('lat' in item) || !('lon' in item)) return;
                if (isNaN(item.lat) || isNaN(item.lon)) return;

                const lat  = parseFloat(item.lat);
                const lon  = parseFloat(item.lon);
                const mmsi = item.mmsi;

                // ✅ CORRECT COURSE HANDLING
                let course = Number(item.cog ?? item.course);

                if (!Number.isFinite(course) || course < 0 || course >= 360) {
                    course = 0;          // AIS 511 / invalid → north fallback
                }

                const marker = L.marker([lat, lon], {
                    icon: customIcon
                }).addTo(map);

                const triangleElement = marker.getElement().querySelector(".triangle");

                let rotation = course + "deg";
                let borderColor = "white";

                // Message-type styling
                if (item.type === 1) borderColor = "red";
                else if (item.type === 2) borderColor = "pink";
                else if (item.type === 3) borderColor = "green";
                else if (item.type === 18) borderColor = "green";
                else if (item.type === 19) borderColor = "lime";
                else if (item.type === 21) {
                    rotation = "0deg";
                    borderColor = "yellow";

                    // GPS base station style
                    setElementStyles(
                        triangleElement,
                        ["width","height","border-right","border-left","border-bottom"],
                        ["7px","7px","0","0","7px solid"]
                    );
                }
                else if (item.type === 4) {
                    rotation = "0deg";
                    borderColor = "black";

                    // GPS base station style
                    setElementStyles(
                        triangleElement,
                        ["width","height","border-right","border-left","border-bottom"],
                        ["7px","7px","0","0","7px solid"]
                    );
                }

                // ✅ APPLY STYLE
                setElementStyles(
                    triangleElement,
                    ["--rotation","border-bottom-color"],
                    [rotation,borderColor]
                );

                // --------------------
                // Popup name lookup
                // --------------------

                let popupContent = `<div>${mmsi}<br>`;
                let iteminfo = null;
                let shipName = null;

                for (const info of data) {
                    if (
                        ((info.type === '5' || info.type === '24') && info.mmsi === mmsi)
                        || (info.type === '19' && info.mmsi === mmsi)
                    ) {
                        iteminfo = info;
                        shipName = info.shipname;
                        popupContent += shipName ?? "";
                        break;
                    }
                }

                popupContent += '</div>';
                marker.bindPopup(popupContent);

                setElementsDisplay([infoBox], 'none');

                // --------------------

                    rippleCircle.classList.add('pulse-animation');

                    setTimeout(() => {
                        if (currentRipple) currentRipple.remove();

                // --------------------

                // --------------------

                triangleElement.addEventListener('mouseover', () => {

                    const countryName = item.country;

            // Define variables to store the last item and its corresponding iteminfo

        // function to initialize the map 
        function initializeMap(){

            var mapContainer = document.getElementById('map-container');

            var map = L.map(mapContainer, {
                zoomControl: false // disable default top-left control
            });

            // Add zoom control at bottom-right
            L.control.zoom({
                position: 'bottomright'
            }).addTo(map);

            // Create a div to show coordinates
            const coordsDiv = L.control({ position: 'bottomright' });

            coordsDiv.onAdd = function(map) {
                this._div = L.DomUtil.create('div', 'coords');
                this.update();
                return this._div;
            };

            coordsDiv.update = function(latlng) {
                this._div.innerHTML = latlng 
                    ? `(${latlng.lat.toFixed(5)},${latlng.lng.toFixed(5)})`
                    : 'Move mouse over map';
            };

            coordsDiv.addTo(map);

            // Update coordinates on mouse move
            map.on('mousemove', function(e) {
                coordsDiv.update(e.latlng);
            });

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: 'Map data &copy; OpenStreetMap contributors'
            }).addTo(map);

            streetMapButton.classList.add("active");

            map.setView([0, 0], 2);

            // ✅ TRIANGLE SCALING BASED ON ZOOM
            function updateTriangleScale() {

                const zoom = map.getZoom();

                const minZoom  = 2;
                const maxZoom  = 12;

                const minScale = 0.4;
                const maxScale = 1;

                // Clamp zoom range
                const z = Math.min(Math.max(zoom, minZoom), maxZoom);

                // Linear scale interpolation
                const scale =
                    minScale +
                    ((z - minZoom) * (maxScale - minScale)) /
                    (maxZoom - minZoom);

                // Apply to all triangles via CSS var
                document.documentElement.style.setProperty('--scale', scale);
            }

            // Bind zoom scaling
            map.on('zoomend', updateTriangleScale);

            // Initial scale set
            updateTriangleScale();

            return map;
        }

        // Set the global URL and call fetchData
        function setVesselClassURL(vClass) {
            if (vClass === "all") {
                URL = API_BASE + "/all";
            } else {
                URL = `${API_BASE}/class?vessel_class=${vClass}`;
            }

            mode = "Live";       // optional: set mode if needed
            option = "Class";    // optional: track that this is a class filter
            zoomstatus = false;  // optional: adjust map zoom behavior
            fetchData(URL);      // use your existing fetchData
        }


        
        // function used to reset map (used a lot)
        function resetMap(){
            limitData = 3000;
            event.preventDefault();
            durationBar.style.display = 'none';
            historyButton.classList.remove("active");
            satelliteDataButton.classList.remove("active");
            terrestrialDataButton.classList.remove("active");
            liveButton.classList.add("active");
            allDataButton.classList.add("active");
            infostatus = false;
            zoomstatus = false;
            searchInput.value = "";
            liveAll();
        };
        
        // function to show account information in login page
        function showAccountInfo (account){
            setElementsDisplay([tokenForm],'flex')

            const timeExpiry = new Date(account.time_expiry);
            const timeDifferenceMs = timeExpiry - currentDate;
            let timeLeft

            // Check if the time has not already expired
            if (timeDifferenceMs > 0) {
                // Calculate days, hours, and minutes left
                const daysLeft = Math.floor(timeDifferenceMs / (1000 * 60 * 60 * 24));
                const hoursLeft = Math.floor((timeDifferenceMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutesLeft = Math.floor((timeDifferenceMs % (1000 * 60 * 60)) / (1000 * 60));
                
                timeLeft = `Expire in ${daysLeft}d ${hoursLeft}h ${minutesLeft}m`
            } else {
                timeLeft = "Expired";
            }
            let accountInfoContent = "<table class='account-info-table'>";
            accountInfoContent += `<tr><td>Authorization Token</td><td>:</td><td>${account.auth_token}</td></tr>`;
            accountInfoContent += `<tr><td>E-mail</td><td>:</td><td>${account.email}</td></tr>`;
            accountInfoContent += `<tr><td>Username</td><td>:</td><td>${account.username}</td></tr>`;
            accountInfoContent += `<tr><td>Valid Until</td><td>:</td><td>${account.time_expiry} (${timeLeft})</td></tr>`;
            accountInfoContent += "</table>";
            
            accountContent.innerHTML = accountInfoContent;
        }

        //function to copy text to clipboard
        function copyToClipboard(textToCopy) {
            // Create a temporary input element to copy the text
            var tempInput = document.createElement("input");
            tempInput.value = textToCopy;

            // Append the input element to the document
            document.body.appendChild(tempInput);

            // Select the text inside the input element
            tempInput.select();

            // Copy the selected text to the clipboard
            document.execCommand("copy");

            // Remove the temporary input element
            document.body.removeChild(tempInput);

            // Optionally, provide user feedback (e.g., an alert)
            alert("Token copied to clipboard: " + textToCopy);
        }


        const layerIcon = document.getElementById('layer-icon');
        const rightPopupLayers = document.getElementById('right-popup-layers');

        const filterIcon = document.getElementById('filter-icon');
        const rightPopupFilter = document.getElementById('right-popup-filter');

        layerIcon.addEventListener('click', () => {
            // Hide the filter popup if it's open
            if (rightPopupFilter.style.display === 'block') {
                rightPopupFilter.style.display = 'none';
            }

            // Toggle the layers popup visibility
            if (rightPopupLayers.style.display === 'none' || rightPopupLayers.style.display === '') {
                rightPopupLayers.style.display = 'block';
            } else {
                rightPopupLayers.style.display = 'none';
            }
        });

        filterIcon.addEventListener('click', () => {
            // Hide the layers popup if it's open
            if (rightPopupLayers.style.display === 'block') {
                rightPopupLayers.style.display = 'none';
            }

            // Toggle the filter popup visibility
            if (rightPopupFilter.style.display === 'none' || rightPopupFilter.style.display === '') {
                rightPopupFilter.style.display = 'block';
            } else {
                rightPopupFilter.style.display = 'none';
            }
        });




        let showHeat = false;
        let heatLayer = null;

        function generateHeatmapData(aisArray) {
            return aisArray
                .filter(d => d.lat && d.lon && !isNaN(d.lat) && !isNaN(d.lon))
                .map(d => [parseFloat(d.lat), parseFloat(d.lon), 1]); // intensity = 1
        }

        function showHeatmap(aisArray) {
            const heatData = generateHeatmapData(aisArray);

            // Remove previous heatmap
            if (heatLayer) {
                map.removeLayer(heatLayer);
            }

            heatLayer = L.heatLayer(heatData, {
                radius: 25,
                blur: 15,
                maxZoom: 17,
                gradient: {0.2: 'blue', 0.4: 'lime', 0.6: 'yellow', 0.8: 'orange', 1.0: 'red'}
            }).addTo(map);
        }

        // Toggle heatmap button
        document.getElementById('toggleHeatmapBtn').addEventListener('click', () => {
            showHeat = !showHeat;

            if (showHeat) {
                showHeatmap(currentMap);
            } else {
                if (heatLayer) map.removeLayer(heatLayer);
                markVessel(currentMap);
            }
        });

        // === THIS IS THE KEY PART ===
        // Whenever your time filter updates currentMap, call this:
        function updateMapAfterFilter(newFilteredData) {
            currentMap = newFilteredData; // update global
            if (showHeat) {
                showHeatmap(currentMap);
            } else {
                markVessel(currentMap);
            }
        }



        
    });
