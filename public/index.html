<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NaviSense</title>
<link rel="icon" href="AltairLogo2.jpg" type="image/x-icon">
<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>

<body>

    <header>
        <h2 class="logo">NaviSense by Altair Research Lab</h2>
        <nav class="navigation">
            <a href="index.html">Home</a>
            <a href="#">About</a>
            <!-- <a href="#">Service</a> -->
            <a href="#">Contact</a>
            <!-- <button id="btnLogin" class="btnlogin-popup">Login</button> -->
        </nav>
    </header>



    <div class="wrapper">

        <!-- <span class="icon-close">
            <i class='bx bxs-x-circle' ></i>
        </span> -->

        <div class="form-box login">
            <form action="#">
                <h1>Login</h1>
    
                <div class="input-box">
                    <input type="email" id="email" autocomplete="off" placeholder="Email" required>
                    <i class='bx bx-envelope'></i>
                </div>
    
                <div class="input-box">
                    <input type="password" id="password" autocomplete="off" placeholder="Password" required>
                    <i class='bx bx-lock-alt'></i>
                </div>
    
                <div class="remember-forgot">
                    <label>
                        <input type="checkbox"> Remember Me
                    </label>
                    <a href="#">Forgot Password</a>
                </div>
    
                <button type="submit" id="btnLogin" class="btn-login">Login</button>
    
                <div class="register-link">
                    <p>Don't have an account? <a href="register.html">Register</a></p>
                </div>
        </div>
       </form>
    </div>




    <script src="script.js"></script>
</body>



</html>
